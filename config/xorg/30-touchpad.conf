Section "InputClass"
	Identifier "touchpad"
	MatchIsTouchpad "on"
	MatchDevicePath "/dev/input/event*"
	Driver "libinput"

	# This ELAN surface is a clickpad with a single physical button (BTN_LEFT),
	# so a physical press anywhere always reports left click. Enable tap-to-click
	# and clickfinger to get right/middle clicks without a separate button:
	#   tap 1 finger        = left click
	#   tap 2 fingers       = right click
	#   physical press 1 finger  = left click
	#   physical press 2 fingers = right click
	Option "Tapping" "on"
	Option "ClickMethod" "clickfinger"

	# tap map: 1 finger = left click, 2 fingers = right click (lrm).
	# Without this, the driver default is lmr (2 fingers = middle).
	Option "TappingButtonMap" "lrm"

	# macOS-style scrolling: two fingers move the content. This also makes the
	# canvas navigation gesture (two fingers on the background) feel like
	# dragging the infinite canvas.
	Option "NaturalScrolling" "on"

	# Two-finger scroll is already the default method; keep it explicit.
	Option "ScrollMethod" "twofinger"

	# Keep palm/keyboard detection active while typing.
	Option "DisableWhileTyping" "on"
EndSection
